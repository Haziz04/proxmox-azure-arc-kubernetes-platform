apiVersion: apps/v1
kind: Deployment
metadata:
  name: tvms-nvr-ui
  namespace: demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tvms-nvr-ui

  template:
    metadata:
      labels:
        app: tvms-nvr-ui

    spec:
      nodeSelector:
        workload-role: worker

      containers:
        - name: lightnvr
          image: docker.io/haziz04/tvms-nvr-demo:v1.0.0

          ports:
            - containerPort: 8080

          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: tvms-nvr-ui
  namespace: demo

spec:
  type: NodePort

  selector:
    app: tvms-nvr-ui

  sessionAffinity: ClientIP

  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082
